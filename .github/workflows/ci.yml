name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0 # disable husky hooks in CI — hooks only matter for interactive commits

jobs:
  check:
    name: Typecheck / Lint / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Read the pinned template revision (single source of truth: .github/template-repo.rev —
      # see CONTRIBUTING.md "Bumping the pinned template revision") so the checkout step below
      # can reference it without duplicating the SHA anywhere else. Validate the format here so a
      # malformed/empty pin fails with a clear, actionable message instead of an opaque checkout
      # error from the next step.
      - name: Read pinned template revision
        id: template-rev
        run: |
          sha="$(tr -d '[:space:]' < .github/template-repo.rev)"
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error file=.github/template-repo.rev::Expected a single full 40-character hex SHA, got: '$sha'" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # Second checkout of the template repo (separate path), pinned to the revision the
      # gemini/kiro bundle parity suites are known to pass against. Requires read access to
      # ai-plugin-marketplace/template from this job's GITHUB_TOKEN (same-owner public repo, so
      # the default token suffices; if the template repo is ever made private, this step needs a
      # token with cross-repo read access instead).
      - name: Checkout pinned template repo
        uses: actions/checkout@v4
        with:
          repository: ai-plugin-marketplace/template
          ref: ${{ steps.template-rev.outputs.sha }}
          path: .template-repo

      - uses: pnpm/action-setup@v4
        # version is read from package.json#packageManager — do not duplicate here

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Reuse the Nx local computation cache across runs, keyed on the lockfile +
      # every input that can invalidate a cached task. A stale-but-valid cache is
      # restored via restore-keys; Nx re-runs any task whose inputs changed and
      # restores unchanged tasks' outputs (e.g. dist) straight from the cache.
      - name: Restore Nx cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'nx.json', 'tsconfig.base.json', 'eslint.config.mjs', '.prettierrc.json', 'vitest.config.ts', 'packages/*/tsconfig.json', 'packages/*/vitest.config.ts', 'packages/*/src/**') }}
          restore-keys: |
            nx-${{ runner.os }}-

      # Single validation gate. `check` fans out to:
      #   - check:packages → `nx run-many --target=check` (dependency-aware, cached):
      #       per package: check:typecheck (tsc --build, outputs dist), check:lint-ts
      #       (incl. cross-target-import isolation per spec §3.4, §12.4, §13; depends on
      #       ^check:typecheck so cross-package types resolve), core's check:api-report
      #       (api-extractor run — validate-only; depends on check:typecheck, NOT build,
      #       so the committed report is never silently regenerated), and test (depends
      #       on ^build so cli resolves core from dist).
      #   - check:workspace → knip, syncpack, prettier --check (run concurrently).
      # Nx restores unchanged tasks' outputs (e.g. dist) straight from the cache.
      # AIPM_TEMPLATE_REPO points the gemini/kiro bundle parity suites at the pinned checkout
      # above; AIPM_REQUIRE_TEMPLATE turns a missing/incomplete checkout into a hard test
      # failure instead of the local skip-with-reason behavior (anti-regression-to-skip guard —
      # see packages/core/src/test-support/template-repo.ts).
      - name: Check (typecheck, lint, api-report, test, knip, syncpack, format)
        run: pnpm run check
        env:
          AIPM_TEMPLATE_REPO: ${{ github.workspace }}/.template-repo
          AIPM_REQUIRE_TEMPLATE: '1'

      # Dogfood: this repo is itself an embedded AI plugin marketplace (see aipm.workspace.ts).
      # Validate that its committed, generated marketplace artifacts are in sync with what
      # `aipm build` would produce. The check step above already built the CLI to dist; CI sets
      # `CI=1`, so any freshness drift is a hard failure.
      - name: Validate embedded marketplace (dogfood)
        run: node packages/cli/dist/bin.js validate

  pack:
    name: Package shape (pnpm pack)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version is read from package.json#packageManager — do not duplicate here

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Restore the same Nx cache so `build` (Nx run-many) replays cached outputs
      # when nothing relevant changed; falls back to a fresh build otherwise.
      - name: Restore Nx cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'nx.json', 'tsconfig.base.json', 'eslint.config.mjs', '.prettierrc.json', 'vitest.config.ts', 'packages/*/tsconfig.json', 'packages/*/vitest.config.ts', 'packages/*/src/**') }}
          restore-keys: |
            nx-${{ runner.os }}-

      - run: pnpm run build

      - name: Pack core
        run: pnpm --filter @ai-plugin-marketplace/core pack

      - name: Pack cli
        run: pnpm --filter @ai-plugin-marketplace/cli pack
