name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck / Lint / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Reuse the Nx local computation cache across runs, keyed on the lockfile +
      # every input that can invalidate a cached task. A stale-but-valid cache is
      # restored via restore-keys; Nx re-runs any task whose inputs changed and
      # restores unchanged tasks' outputs (e.g. dist) straight from the cache.
      - name: Restore Nx cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'nx.json', 'tsconfig.base.json', 'eslint.config.mjs', '.prettierrc.json', 'packages/*/tsconfig.json', 'packages/*/src/**') }}
          restore-keys: |
            nx-${{ runner.os }}-

      # Typecheck via Nx (cached, dependency-aware). run-many builds or restores
      # every project's dist, which the unconditional api:check and test steps
      # below depend on. (affected is intentionally not used: those downstream
      # gates need dist for all projects regardless of which package a PR touched.)
      - name: Typecheck
        run: pnpm run typecheck

      - name: Dependency version consistency (syncpack)
        run: pnpm run syncpack

      - name: Lint (includes cross-target-import isolation check per spec §3.4, §12.4, §13)
        run: pnpm run lint

      - name: Dead code & unused dependencies (knip)
        run: pnpm run knip

      - name: Format check
        run: pnpm run format:check

      - name: API report up to date (API Extractor)
        run: pnpm run api:check

      - name: Test
        run: pnpm run test

  pack:
    name: Package shape (pnpm pack)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Restore the same Nx cache so `build` (Nx run-many) replays cached outputs
      # when nothing relevant changed; falls back to a fresh build otherwise.
      - name: Restore Nx cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'nx.json', 'tsconfig.base.json', 'eslint.config.mjs', '.prettierrc.json', 'packages/*/tsconfig.json', 'packages/*/src/**') }}
          restore-keys: |
            nx-${{ runner.os }}-

      - run: pnpm run build

      - name: Pack core
        run: pnpm --filter @ai-plugin-marketplace/core pack

      - name: Pack cli
        run: pnpm --filter @ai-plugin-marketplace/cli pack
