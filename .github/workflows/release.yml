name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: # allow a maintainer to trigger a release manually

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  HUSKY: 0 # changesets may commit during versioning; skip hooks in CI

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version is read from package.json#packageManager — do not duplicate here

      - uses: actions/setup-node@v6
        with:
          # Trusted publishing (OIDC) requires npm >=11.5.1 and Node >=22.14.0.
          node-version: '24.14.0'
          registry-url: 'https://registry.npmjs.org'
          # Disabled as defense-in-depth for this publishing job, per npm's
          # trusted-publishing guidance: a poisoned cache could expose the
          # OIDC-derived publish token.
          package-manager-cache: false

      - name: Show release toolchain
        run: node --version && npm --version && pnpm --version

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
