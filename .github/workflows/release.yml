name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: # allow a maintainer to trigger a release manually once NPM_TOKEN is set

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  HUSKY: 0 # changesets may commit during versioning; skip hooks in CI

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version is read from package.json#packageManager — do not duplicate here

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          # registry-url causes setup-node to write `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`
          # into the project .npmrc, which npm reads when publishing.
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Configure npm auth
        # setup-node sets NPM_CONFIG_USERCONFIG to a temp .npmrc and NODE_AUTH_TOKEN to the
        # token value (from registry-url + NODE_AUTH_TOKEN env). Write auth into that file so
        # pnpm publish (called by changeset publish) can authenticate with the registry.
        run: |
          NPMRC="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" >> "$NPMRC"
          echo "@ai-plugin-marketplace:registry=https://registry.npmjs.org" >> "$NPMRC"

      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
