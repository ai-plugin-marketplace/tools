packages:
  - 'packages/*'

# Allow Nx (and its esbuild dependency) to run their postinstall scripts so the
# native task-runner / daemon binaries are available. Nx is a build/cache tool;
# its scripts are required for it to function.
onlyBuiltDependencies:
  - nx
  - esbuild

# Keep the CLI manifest copy current even when TypeScript would skip it by timestamp.
patchedDependencies:
  typescript@5.9.3: patches/typescript@5.9.3.patch
